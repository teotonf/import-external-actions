name: Clone external repository
run-name: Clone 🚀

on:
  workflow_call:
    inputs:
      external_host:
        description: Host of the external repository
        type: string
        required: true
      external_repo_url:
        description: URL of the external repository
        type: string
        required: true
      external_repo_user:
        description: User to access the external repository
        type: string
      external_repo_ssh_key_location:
        description: Read key file location (Read access to cloned repo)
        type: string
      external_repo_ssh_key_password:
        description: Read key file password, if needed (Read access to cloned repo)
        type: string
      gh_repo_url:
        description: Name of the new repository
        type: string
        required: true
      import_external_repo:
        description: Import external repository to GH
        type: boolean

    secrets:
      gh_token:
        required: true

  workflow_dispatch:
    inputs:
      external_host:
        description: Host of the external repository
        type: string
      external_repo_url:
        description: URL of the external repository
        type: string
        required: true
      external_repo_user:
        description: User to access the external repository
        type: string
      external_repo_ssh_key_location:
        description: Read key file location (Read access to cloned repo)
        type: string
      external_repo_ssh_key_password:
        description: Read key file password, if needed (Read access to cloned repo)
        type: string
      gh_repo_url:
        description: Name of the new repository
        type: string
        required: true
      import_external_repo:
        description: Import external repository to GH
        type: boolean

    secrets:
      gh_token:
        required: true
jobs:
  import-to-gh-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Clone external repository
        uses: ./.github/actions/download-external-repo
        id: clone-repo
        with:
          host: ${{ inputs.external_host }}
          repository_address: ${{ inputs.external_repo_url }}
          private_key_location: ${{ inputs.external_repo_ssh_key_location }}
          key_file_password: ${{ secrets.external_repo_ssh_key_password }}
          username: ${{ inputs.external_repo_user }}
          password: ${{ secrets.external_repo_password }}

      - name: Upload the repository to GH
        uses: ./.github/actions/upload-repo
        if: ${{ inputs.import_external_repo == true || inputs.import_external_repo == 'true' }}
        with:
          repo_location: ${{ steps.clone-repo.outputs.repo_location }}
          gh_token: ${{ secrets.gh_token }}
          gh_repo_url: ${{ inputs.gh_repo_url }}
